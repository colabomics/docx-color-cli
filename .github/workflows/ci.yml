name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.12
      - name: Locate uv cache
        id: cache
        run: echo "path=$(uv cache dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache.outputs.path }}
          key: uv-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies from uv.lock
        run: uv sync --python '${{ matrix.python }}'
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff formatting
        run: uv run --no-sync ruff format --check .
      - name: Complete regression suite
        run: uv run --no-sync pytest
      - name: Build distributions and validate metadata
        run: |
          uv build
          uv run --no-sync twine check --strict dist/*
      - name: Clean wheel installation and conversion
        run: uv run --no-sync python scripts/smoke_wheel.py dist/*.whl
