name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Synthetic Unicode manifests must not depend on a Windows ANSI code page.
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.12
      - name: Locate uv cache
        id: cache
        shell: python
        run: |
          import os, subprocess
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("path=" + subprocess.check_output(["uv", "cache", "dir"], text=True).strip() + "\n")
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache.outputs.path }}
          key: uv-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies from uv.lock
        run: uv sync --python '${{ matrix.python }}'
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff formatting
        run: uv run --no-sync ruff format --check .
      - name: Complete regression suite
        run: uv run --no-sync pytest
      - name: Installed package import
        run: uv run --no-sync python -c "import docx_color_cli"
      - name: Installed three-file CLI help
        run: uv run --no-sync docx-color --help
      - name: Installed version
        run: uv run --no-sync docx-color --version
      - name: Build distributions and validate metadata
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          subprocess.run(["uv", "build"], check=True)
          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if not wheels or not sdists:
              raise RuntimeError("Expected at least one wheel and one source distribution")
          subprocess.run(["uv", "run", "--no-sync", "twine", "check", "--strict", *map(str, wheels + sdists)], check=True)
      - name: Clean wheel installation and conversion
        run: uv run --no-sync python scripts/smoke_wheel.py dist --tracked examples/change_tracked.docx --accepted examples/change_accepted.docx
