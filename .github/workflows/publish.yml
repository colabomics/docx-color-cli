name: Publish

# An ordinary push (including a version bump) can never publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed version in pyproject.toml
        required: true
        type: string
      publish:
        description: Request PyPI upload after validation and environment approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'colabomics/docx-color-cli' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.12
      - run: uv sync --locked
      - name: Verify explicit version and refuse published versions
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUEST_UPLOAD: ${{ inputs.publish }}
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          from scripts.release import get_json, plan, project_version
          version = project_version(Path("pyproject.toml").read_text(encoding="utf-8"))
          if os.environ["REQUESTED_VERSION"] != version:
              raise SystemExit("Requested version does not match the reviewed package")
          if os.environ["REQUEST_UPLOAD"] == "true":
              payload = get_json("https://pypi.org/pypi/docx-color-cli/json")
              published = [v for v, files in payload["releases"].items() if files] if payload else []
              action, reason = plan(version, "0", [], published)
              if action != "publish":
                  raise SystemExit("Refusing upload: " + reason)
          PY
      - name: Build and verify exact distributions
        run: |
          uv run --no-sync python scripts/release.py record
          uv build
          uv run --no-sync twine check --strict dist/*
          uv run --no-sync python scripts/smoke_wheel.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [validate, build]
    # Owner must first verify environment reviewers, branch protection and PyPI
    # trust, then explicitly enable this repository variable. Never set it in CI.
    if: >-
      github.repository == 'colabomics/docx-color-cli' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      inputs.publish && vars.PYPI_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/docx-color-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password/token and no skip-existing: races fail visibly.
